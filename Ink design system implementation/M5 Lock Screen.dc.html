<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="outpost.css"><script src="outpost.js"></script><title>M5 · Lock screen</title></helmet>
<div data-fit="608" style="width:560px;margin:0 auto;padding:8px 0 32px;display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="align-self:stretch"><dc-import name="ViewerBar" code="M5" label="Lock screen" prev="M4 Diff Viewer.dc.html" next="M6 Pair Device.dc.html" hint-size="100%,44px"></dc-import></div>
  <div style="position:relative;width:390px;height:844px;display:flex;flex-direction:column;background:var(--raised);border:1px solid var(--border-strong);border-radius:48px;overflow:hidden;font-size:16px">
    <div style="display:flex;align-items:center;height:54px;flex:none;padding:0 28px 0 36px;font-size:16px;font-weight:600"><span style="flex:1"></span><span style="display:flex;gap:6px;align-items:center"><o-icon name="signal"></o-icon><o-icon name="wifi"></o-icon><o-icon name="battery-full" size="20"></o-icon></span></div>
    <div style="display:flex;flex-direction:column;align-items:center;padding-top:8px">
      <o-icon name="lock" size="20" style="color:var(--text-2)"></o-icon>
      <span style="margin-top:8px;font-size:18px;font-weight:500;color:var(--text-2)">Friday, September 25</span>
      <span style="font-size:88px;line-height:96px;font-weight:600;letter-spacing:-0.03em">9:41</span>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:0 12px 16px">
      <div style="display:flex;flex-direction:column;border-radius:22px;background:var(--surface);border:1px solid var(--border);overflow:hidden">
        <button onClick="{{ toggle }}" style="display:flex;gap:12px;padding:14px;border:0;background:transparent;text-align:left;cursor:pointer;white-space:normal">
          <span style="width:38px;height:38px;flex:none;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center"><span style="width:18px;height:18px;border:1.5px solid var(--on-ink);border-radius:5px;display:flex;align-items:center;justify-content:center"><span style="width:6px;height:6px;background:var(--on-ink);border-radius:1px"></span></span></span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:20px">
            <div style="display:flex;align-items:center;gap:8px;font-size:15px"><span style="font-weight:600;flex:1">Approval needed</span><span style="font-size:13px;color:var(--text-3)">now</span></div>
            <span style="font-size:15px;color:var(--text)">Fix filter chip sync wants to run:</span>
            <span style="font-family:'Geist Mono',monospace;font-size:13px;color:var(--text-2)">git push origin fix/filter-sync</span>
            <span style="font-size:13px;color:var(--text-3)">storefront-web · 3 files +146 −27</span>
          </div>
        </button>
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);animation:o-fade 160ms ease-out">
            <a href="M3 Approval Sheet.dc.html" style="height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;border-right:1px solid var(--border)">Review</a>
            <button onClick="{{ approve }}" style="height:48px;border:0;background:transparent;font-size:16px;font-weight:600;cursor:pointer">Approve</button>
          </div>
        </sc-if>
        <sc-if value="{{ approved }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-top:1px solid var(--border);font-size:14px;color:var(--text-2)"><o-status kind="done"></o-status>Approved. Pushing now.</div>
        </sc-if>
      </div>

      <a href="M2 Live Session.dc.html" style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--border);color:var(--text)">
        <div style="display:flex;align-items:center;gap:10px">
          <o-status kind="running" size="lg"></o-status>
          <span style="flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Draft Q3 board report</span>
          <span style="font-family:'Geist Mono',monospace;font-size:13px;color:var(--text-2)">34:12</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:14px;color:var(--text-2)">Writing <span style="font-family:'Geist Mono',monospace;font-size:13px;color:var(--text)">outputs/summary.md</span></span>
          <span style="font-size:13px;color:var(--text-3)">Step 7 of 9 · finance-ops · <span style="font-family:'Geist Mono',monospace">gpt-5</span></span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(9,1fr);gap:4px">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="9"><span style="height:4px;border-radius:2px;background:{{ s.bg }}"></span></sc-for>
        </div>
      </a>
    </div>
    <div style="display:flex;justify-content:space-between;padding:8px 48px 40px">
      <span style="width:50px;height:50px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center"><o-icon name="flashlight" size="20"></o-icon></span>
      <span style="width:50px;height:50px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center"><o-icon name="camera" size="20"></o-icon></span>
    </div>
    <div style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text)"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { expanded: true, approved: false };
  renderVals() {
    const s = this.state;
    return {
      expanded: s.expanded && !s.approved, approved: s.approved,
      toggle: () => this.setState({ expanded: !s.expanded }), approve: () => this.setState({ approved: true }),
      steps: Array.from({ length: 9 }, (_, i) => ({ bg: i < 6 ? 'var(--ink)' : i === 6 ? 'var(--text-3)' : 'var(--border-strong)' }))
    };
  }
}
</script>
</body>
</html>
