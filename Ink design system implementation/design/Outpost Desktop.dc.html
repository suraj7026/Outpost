<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script>window.__outpostEmbed = true;</script><link rel="stylesheet" href="outpost.css"><script src="outpost.js"></script><title>Outpost · Desktop</title></helmet>
<div onClickCapture="{{ onNav }}" style="min-height:100vh;padding-top:16px">
  <sc-if value="{{ isD1 }}" hint-placeholder-val="{{ false }}"><dc-import name="D1 Home" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD2 }}" hint-placeholder-val="{{ false }}"><dc-import name="D2 Code Session" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD3 }}" hint-placeholder-val="{{ false }}"><dc-import name="D3 Code Approval" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD4 }}" hint-placeholder-val="{{ false }}"><dc-import name="D4 Cowork Session" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD5 }}" hint-placeholder-val="{{ false }}"><dc-import name="D5 Chat Session" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD6 }}" hint-placeholder-val="{{ false }}"><dc-import name="D6 Settings Providers" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD7 }}" hint-placeholder-val="{{ false }}"><dc-import name="D7 Server Devices" hint-size="100%,940px"></dc-import></sc-if>
  <sc-if value="{{ isD8 }}" hint-placeholder-val="{{ false }}"><dc-import name="D8 Connect" hint-size="100%,940px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static R = { D1: 'D1 Home', D2: 'D2 Code Session', D3: 'D3 Code Approval', D4: 'D4 Cowork Session', D5: 'D5 Chat Session', D6: 'D6 Settings Providers', D7: 'D7 Server Devices', D8: 'D8 Connect' };
  static KEY = 'outpost-desktop-route';
  _embed = (window.__outpostEmbed = true);
  state = { r: this.initial() };
  initial() {
    const h = location.hash.slice(1);
    if (Component.R[h]) return h;
    try { const s = localStorage.getItem(Component.KEY); if (Component.R[s]) return s; } catch (e) {}
    return 'D8';
  }
  componentDidMount() {
    window.__outpostNav = href => { const m = String(href).match(/(D\d) /); if (m && Component.R[m[1]]) this.go(m[1]); };
    this.hc = () => { const h = location.hash.slice(1); if (Component.R[h] && h !== this.state.r) this.setState({ r: h }); };
    addEventListener('hashchange', this.hc);
    if (location.hash.slice(1) !== this.state.r) history.replaceState(null, '', '#' + this.state.r);
  }
  componentWillUnmount() { removeEventListener('hashchange', this.hc); }
  go(r) {
    if (r === this.state.r) return;
    try { localStorage.setItem(Component.KEY, r); } catch (e) {}
    location.hash = r;
    this.setState({ r });
    window.scrollTo(0, 0);
  }
  renderVals() {
    const r = this.state.r, v = {};
    Object.keys(Component.R).forEach(k => { v['is' + k] = r === k; });
    v.onNav = e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = decodeURIComponent(a.getAttribute('href') || '');
      if (href === '#' || href === '') { e.preventDefault(); return; }
      const m = href.match(/(?:^|\/)(D\d) [^/]*\.dc\.html$/);
      if (m && Component.R[m[1]]) { e.preventDefault(); this.go(m[1]); }
      else if (/\.dc\.html$/.test(href)) e.preventDefault();
    };
    return v;
  }
}
</script>
</body>
</html>
