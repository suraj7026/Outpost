<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="outpost.css"><script src="outpost.js"></script></helmet>
<aside style="width:264px;height:100%;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)">
  <div style="display:flex;align-items:center;gap:8px;height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border)">
    <a href="D1 Home.dc.html" style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--text)"><span style="width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center"><span style="width:6px;height:6px;background:var(--ink);border-radius:1px"></span></span>Outpost</a>
    <div style="flex:1"></div>
    <button title="Collapse sidebar" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--text-3);cursor:pointer" style-hover="background:var(--ink-subtle);color:var(--text)"><o-icon name="panel-left"></o-icon></button>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px;padding:10px 8px 6px">
    <a href="D1 Home.dc.html" style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-weight:500;color:var(--text)" style-hover="background:var(--ink-subtle)"><o-icon name="plus"></o-icon>New session<span style="flex:1"></span><kbd style="font-family:'Geist Mono',monospace;font-size:12px;color:var(--text-3)">⌘N</kbd></a>
    <div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;margin-top:4px;border-radius:6px;font-size:13px;color:var(--text-3)"><o-icon name="search"></o-icon>Search<span style="flex:1"></span><kbd style="font-family:'Geist Mono',monospace;font-size:12px">⌘K</kbd></div>
  </div>
  <div style="flex:1;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:12px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:1px">
        <div style="display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;font-size:12px;color:var(--text-3)"><o-icon name="{{ g.icon }}" size="14"></o-icon><span style="font-family:'Geist Mono',monospace">{{ g.name }}</span><span style="flex:1"></span><span>{{ g.count }}</span></div>
        <sc-for list="{{ g.items }}" as="s" hint-placeholder-count="3">
          <a href="{{ s.href }}" title="{{ s.title }}" style="position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:6px;background:{{ s.bg }};color:{{ s.color }};font-size:13px;transition:background 120ms ease-out" style-hover="background:var(--ink-subtle);color:var(--text)">
            <span style="position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:{{ s.bar }}"></span>
            <o-icon name="{{ s.icon }}" style="color:var(--text-3)"></o-icon>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.title }}</span>
            <o-status kind="{{ s.status }}"></o-status>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px;padding:8px;border-top:1px solid var(--border)">
    <a href="D7 Server Devices.dc.html" style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:{{ serverBg }};font-size:13px;color:var(--text-2)" style-hover="background:var(--ink-subtle);color:var(--text)"><o-icon name="server"></o-icon>Server &amp; devices</a>
    <a href="D6 Settings Providers.dc.html" style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:{{ settingsBg }};font-size:13px;color:var(--text-2)" style-hover="background:var(--ink-subtle);color:var(--text)"><o-icon name="settings"></o-icon>Settings<span style="flex:1"></span><kbd style="font-family:'Geist Mono',monospace;font-size:12px;color:var(--text-3)">⌘,</kbd></a>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px 4px"><span style="width:24px;height:24px;border-radius:50%;background:var(--raised);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-2)">MC</span><span style="font-size:13px;color:var(--text)">Maya Chen</span></div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:264,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;filter&quot;,&quot;q3&quot;,&quot;queue&quot;,&quot;settings&quot;,&quot;server&quot;],&quot;default&quot;:&quot;filter&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;approval&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  static G = [
    { name: 'storefront-web', icon: 'folder-git-2', items: [
      ['filter', 'Fix filter chip sync on /products', 'code', 'running', 'D2 Code Session.dc.html'],
      ['e2e', 'Add Playwright smoke tests for checkout', 'code', 'failed', 'D2 Code Session.dc.html'],
      ['actions', 'Move checkout to server actions', 'code', 'done', 'D2 Code Session.dc.html']] },
    { name: 'finance-ops', icon: 'folder', items: [
      ['q3', 'Draft Q3 board report', 'cowork', 'running', 'D4 Cowork Session.dc.html'],
      ['pipe', 'Reconcile September pipeline', 'cowork', 'done', 'D4 Cowork Session.dc.html']] },
    { name: 'infra', icon: 'folder-git-2', items: [
      ['tls', 'Rotate TLS certs on edge nodes', 'code', 'interrupted', 'D2 Code Session.dc.html']] },
    { name: 'No workspace', icon: 'message-square', items: [
      ['queue', 'Postgres vs Redis for job queues', 'chat', 'done', 'D5 Chat Session.dc.html'],
      ['rust', 'Lifetimes in iterator adapters', 'chat', 'done', 'D5 Chat Session.dc.html']] }
  ];
  renderVals() {
    const p = this.props, icons = { code: 'code-xml', cowork: 'file-text', chat: 'message-square' };
    const groups = Component.G.map(g => ({
      name: g.name, icon: g.icon, count: g.items.length,
      items: g.items.map(([id, title, mode, status, href]) => {
        const on = id === p.active;
        if (id === 'filter' && p.approval) status = 'needs';
        return { title, href, status, icon: icons[mode], bg: on ? 'var(--ink-subtle)' : 'transparent', bar: on ? 'var(--ink)' : 'transparent', color: on ? 'var(--text)' : 'var(--text-2)' };
      })
    }));
    return { groups, serverBg: p.active === 'server' ? 'var(--ink-subtle)' : 'transparent', settingsBg: p.active === 'settings' ? 'var(--ink-subtle)' : 'transparent' };
  }
}
</script>
</body>
</html>
