<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Icon Slide" description="Three-column icon-led feature grid — numbered callouts with headings and body" -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}</style>
</helmet>
<div style="width:1280px;height:720px;background:#fff;font-family:'Jost','Tw Cen MT',sans-serif;position:relative;overflow:hidden">
  <div style="padding:44px 48px 0">
    <div style="font-size:16pt;font-weight:600;color:#1C2C59;line-height:1.2;padding-bottom:10px">{{ title }}</div>
  </div>
  <div style="height:0;border-bottom:2px solid #cccccc;margin:0 0"></div>
  <div style="padding:40px 64px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;height:calc(720px - 44px - 56px - 36px);overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="width:64px;height:64px;border-radius:50%;background:#27698D;display:flex;align-items:center;justify-content:center;font-size:24pt;font-weight:600;color:#fff;flex-shrink:0">1</div>
      <div style="font-size:16pt;font-weight:600;color:#1C2C59;line-height:1.2">{{ icon1Title }}</div>
      <div style="font-size:15pt;color:#526B7A;line-height:1.4">{{ icon1Body }}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="width:64px;height:64px;border-radius:50%;background:#469086;display:flex;align-items:center;justify-content:center;font-size:24pt;font-weight:600;color:#fff;flex-shrink:0">2</div>
      <div style="font-size:16pt;font-weight:600;color:#1C2C59;line-height:1.2">{{ icon2Title }}</div>
      <div style="font-size:15pt;color:#526B7A;line-height:1.4">{{ icon2Body }}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="width:64px;height:64px;border-radius:50%;background:#FFB100;display:flex;align-items:center;justify-content:center;font-size:24pt;font-weight:600;color:#1C2C59;flex-shrink:0">3</div>
      <div style="font-size:16pt;font-weight:600;color:#1C2C59;line-height:1.2">{{ icon3Title }}</div>
      <div style="font-size:15pt;color:#526B7A;line-height:1.4">{{ icon3Body }}</div>
    </div>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;height:36px;border-top:2px solid #cccccc;display:flex;align-items:center;padding:0 48px;justify-content:space-between;background:#fff">
    <img src="assets/TDG_logo.png" alt="The Dedham Group" style="height:20px">
    <span style="font-size:7.5pt;color:#526B7A;letter-spacing:0.06em">CONFIDENTIAL AND PROPRIETARY</span>
    <span style="font-size:9pt;color:#526B7A">{{ pageNumber }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 720},
  &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Three pillars of our approach&quot;},
  &quot;icon1Title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;First capability area&quot;, &quot;section&quot;: &quot;Column 1&quot;},
  &quot;icon1Body&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Description of this capability and its relevance to the client context.&quot;, &quot;section&quot;: &quot;Column 1&quot;},
  &quot;icon2Title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Second capability area&quot;, &quot;section&quot;: &quot;Column 2&quot;},
  &quot;icon2Body&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Description of this capability and its relevance to the client context.&quot;, &quot;section&quot;: &quot;Column 2&quot;},
  &quot;icon3Title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Third capability area&quot;, &quot;section&quot;: &quot;Column 3&quot;},
  &quot;icon3Body&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Description of this capability and its relevance to the client context.&quot;, &quot;section&quot;: &quot;Column 3&quot;},
  &quot;pageNumber&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 6, &quot;min&quot;: 1, &quot;max&quot;: 99}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      title: this.props.title ?? 'Three pillars of our approach',
      icon1Title: this.props.icon1Title ?? 'First capability area',
      icon1Body: this.props.icon1Body ?? 'Description of this capability and its relevance to the client context.',
      icon2Title: this.props.icon2Title ?? 'Second capability area',
      icon2Body: this.props.icon2Body ?? 'Description of this capability and its relevance to the client context.',
      icon3Title: this.props.icon3Title ?? 'Third capability area',
      icon3Body: this.props.icon3Body ?? 'Description of this capability and its relevance to the client context.',
      pageNumber: this.props.pageNumber ?? 6,
    };
  }
}
</script>
</body>
</html>
