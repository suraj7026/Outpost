apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-access
  namespace: outpost-verification
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: surajhomeserver
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpu-test
          image: nvidia/cuda:12.6.3-base-ubuntu24.04
          command: [nvidia-smi, '--query-gpu=name,memory.total,driver_version', '--format=csv']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
              nvidia.com/gpu: 1
