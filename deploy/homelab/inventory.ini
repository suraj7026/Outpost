[control_plane]
surajhomeserver ansible_connection=local ansible_user=surajadmin

[workers]
surajhomeserver2 ansible_host=192.168.1.61 ansible_user=surajadmin2 ansible_ssh_private_key_file=~/.ssh/outpost-cluster

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/outpost-cluster-known-hosts'
