[project]
name = "outpost-browser-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["browser-use==0.13.14"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["environment", "worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
